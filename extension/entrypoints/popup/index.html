<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internet MCP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      background: #07080c;
      color: #cbd5e1;
      padding: 24px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .eye-container {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .link-map {
      width: 100%;
      margin-top: 16px;
    }

    .link-map svg {
      display: block;
      width: 100%;
      overflow: visible;
    }

    .link {
      fill: none;
      stroke: #1e293b;
      stroke-width: 1.5;
      transition: stroke 0.2s ease;
    }

    .live .link.agent {
      stroke: rgba(192, 132, 252, 0.45);
    }

    .live .link.browser {
      stroke: rgba(0, 255, 255, 0.35);
    }

    .live .link.browser.here,
    .live .node.browser:hover + .link,
    .live .link.browser.hot {
      stroke: #00ffff;
    }

    .link-map:not(.live) .link {
      stroke-dasharray: 3 4;
    }

    .pulse.agent {
      fill: #e9d5ff;
    }

    .pulse.browser {
      fill: #a5f3fc;
    }

    .node-dot.agent {
      fill: #c084fc;
    }

    .node-dot.browser {
      fill: #334155;
    }

    .live .node-dot.browser {
      fill: #64748b;
    }

    .live .node-dot.browser.here {
      fill: #00ffff;
    }

    .halo {
      fill: none;
      stroke: #00ffff;
      stroke-width: 1;
      opacity: 0.5;
    }

    .node-label {
      font-size: 11px;
      fill: #64748b;
    }

    .node-label.here {
      fill: #00ffff;
      font-weight: 600;
    }

    .node.browser {
      cursor: default;
    }

    .node.browser:hover .node-label {
      fill: #e2e8f0;
    }

    .eye-frame {
      fill: #07080c;
      stroke: #475569;
      stroke-width: 2;
    }

    .live .eye-frame {
      stroke: #64748b;
    }

    .eye-pupil {
      fill: none;
      stroke: #00f2fe;
      stroke-width: 2;
    }

    .vision-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      user-select: none;
    }

    .vision-eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      color: #888;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .vision-main {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .tab-count-value {
      font-size: 38px;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2fe 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .vision-tabs-text {
      font-size: 18px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .pill {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0;
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-value {
      font-weight: 600;
    }

    /* Connected state styling */
    .pill.connected .status-value {
      color: #00ffff;
    }

    .pill.connected .status-dot {
      background: #00ffff;
    }

    /* Disconnected state styling */
    .pill.disconnected .status-value {
      color: #ff5353;
    }

    .pill.disconnected .status-dot {
      background: #ff5353;
    }

    .footer {
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
      margin-top: 4px;
    }

    .links-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .support-link {
      color: #888;
      text-decoration: none;
      transition: color 0.2s ease;
      font-weight: 500;
    }

    .support-link:hover {
      color: #cbd5e1;
    }

    .toggle-container {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 28px;
      height: 16px;
    }

    .toggle-input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 16px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 50%;
    }

    .toggle-input:checked + .toggle-slider {
      background-color: #00ffff;
    }

    .toggle-input:checked + .toggle-slider:before {
      transform: translateX(12px);
      background-color: #07080c;
    }
  </style>
</head>

<body>
  <label class="toggle-container" aria-label="Toggle MCP">
    <input type="checkbox" id="powerToggle" class="toggle-input" checked>
    <span class="toggle-slider"></span>
  </label>

  <div class="eye-container link-map" id="linkMap" role="img" aria-label="Connection map"></div>

  <div class="vision-container">
    <div class="vision-eyebrow">MCP can see</div>
    <div class="vision-main">
      <span class="tab-count-value" id="tabCount">–</span>
      <span class="vision-tabs-text" id="tabWord">Tabs</span>
    </div>
  </div>

  <div class="footer">
    <div class="links-row">
      <a href="https://github.com/jamubc/2manytabs-mcp" target="_blank" class="support-link">Github</a>
      <div class="pill disconnected" id="statusPill">
        <span class="status-dot"></span>
        <span class="status-value" id="statusText">Disconnected</span>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>

</html>
