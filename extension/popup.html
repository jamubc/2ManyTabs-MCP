<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2ManyTabs MCP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      background: #07080c;
      color: #cbd5e1;
      padding: 18px 16px 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .eye-container {
      margin-top: 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .robot-eye {
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.2));
    }

    .vision-container {
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
    }

    .tab-count-value {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2fe 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .pill {
      font-size: 10px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-bottom: 0;
      margin-left: 8px;
      margin-right: 8px;
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-value {
      font-weight: 600;
    }

    /* Connected state styling */
    .pill.connected .status-value {
      color: #00f2fe;
    }

    .pill.connected .status-dot {
      background: #00f2fe;
      box-shadow: 0 0 8px #00f2fe;
      animation: status-pulse 1.8s infinite ease-in-out;
    }

    /* Disconnected state styling */
    .pill.disconnected .status-value {
      color: #ff5353;
    }

    .pill.disconnected .status-dot {
      background: #ff5353;
    }

    @keyframes status-pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px #00f2fe; }
    }

    .footer {
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 12px;
      margin-top: 6px;
    }

    .links-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
    }

    .support-link {
      color: #00f2fe;
      text-decoration: none;
      transition: color 0.2s ease;
      font-weight: 500;
    }

    .support-link:hover {
      color: #c084fc;
      text-decoration: underline;
    }

    .quote {
      color: #64748b;
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 3px;
      user-select: none;
    }

    .heart {
      color: #f43f5e;
      display: inline;
    }
  </style>
</head>

<body>
  <div class="eye-container">
    <svg class="robot-eye" viewBox="0 0 100 100" width="56" height="56">
      <!-- Robot head outline -->
      <rect x="18" y="28" width="64" height="44" rx="12" fill="none" stroke="#475569" stroke-width="4"/>
      <path d="M42 28 V18 H58 V28" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="50" cy="14" r="3" fill="#00f2fe"/>
      <!-- Robot eye lens -->
      <circle cx="50" cy="50" r="14" fill="none" stroke="#00f2fe" stroke-width="4"/>
      <circle cx="50" cy="50" r="7" fill="#00f2fe">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <!-- Small ear elements -->
      <rect x="12" y="42" width="6" height="16" rx="2" fill="#334155"/>
      <rect x="82" y="42" width="6" height="16" rx="2" fill="#334155"/>
    </svg>
  </div>

  <div class="vision-container">
    <span>MCP can see:</span>
    <span class="tab-count-value" id="tabCount">–</span>
    <span>Tabs</span>
  </div>

  <div class="footer">
    <div class="links-row">
      <a href="https://github.com/jamubc/2manytabs-mcp" target="_blank" class="support-link">Github</a>
      <div class="pill disconnected" id="statusPill">
        <span class="status-dot"></span>
        <span class="status-value" id="statusText">Disconnected</span>
      </div>
      <span class="quote">built with <span class="heart">♥</span> for open source</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
